<!DOCTYPE html>
<html lang="en">
<head>
  <title>Form Validation</title>
  <style>
    body {
  font-family: Arial, sans-serif;
  background-color: #f4f4f9;
  margin: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.form-container {
  background-color: #fff;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  width: 300px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
}

.required {
  color: red;
}

input {
  width: 100%;
  padding: 8px;
  margin-bottom: 5px;
  border: 1px solid #ccc;
  border-radius: 5px;
}

.error-message {
  font-size: 12px;
  color: red;
  display: none;
  margin-bottom: 15px;
}

.button-group {
  display: flex;
  justify-content: space-between;
}

button {
  padding: 10px 15px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

#submitBtn {
  background-color: #28a745;
  color: white;
}

#cancelBtn {
  background-color: #dc3545;
  color: white;
}

button:hover {
  opacity: 0.9;
}

#message {
  margin-top: 10px;
  text-align: center;
  font-size: 14px;
  color: #555;
}

  </style>
</head>
<body>
  <div class="form-container">
    <h2>Registration Form</h2> 
    <form id="registrationForm" novalidate>
      <label for="username">Name</label>
      <input type="text" id="username" name="username" placeholder="Enter your username">
      <span class="error-message" id="usernameError">Name is required.</span>

      <label for="address">Address</span></label>
      <input type="address" id="address" name="address" placeholder="Enter your Address">
      <span class="error-message" id="addressError">Address is required.</span>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email">
      <span class="error-message" id="emailError">Email is required.</span>

      <label for="password">Password</span></label>
      <input type="text" id="password" name="password" placeholder="Enter your password">
      <span class="error-message" id="passwordError">Password is required.</span>

      <div class="button-group">
        <button type="submit" id="submitBtn">Submit</button>
        <button type="button" id="cancelBtn">Cancel</button>
      </div>
    </form>
    <div id="message"></div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
  var form = document.getElementById("registrationForm");
  var cancelBtn = document.getElementById("cancelBtn");
  var message = document.getElementById("message");

  // Get input fields and error messages
  var username = document.getElementById("username");
  var email = document.getElementById("email");
  var aaddress = document.getElementById("aaddress");
  var password = document.getElementById("password");


  var usernameError = document.getElementById("usernameError");
  var emailError = document.getElementById("emailError");
  var aaddressError = document.getElementById("aaddressError");
  var passwordError = document.getElementById("passwordError");

  // Validate form inputs
  var validateInput = (input, errorMessage) => {
    if (input.value.trim() === "") {
      errorMessage.style.display = "block";
      return false;
    } else {
      errorMessage.style.display = "none";
      return true;
    }
  };

  // Submit event listener
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    var isUsernameValid = validateInput(username, usernameError);
    var isEmailValid = validateInput(email, emailError);
    var isaddressValid = validateInput(address, addressError);
    var isPasswordValid = validateInput(password, passwordError);

    if (isUsernameValid && isEmailValid && isaddressValid && isPasswordValid) {
      message.textContent = "Form submitted successfully!";
      message.style.color = "green";
      form.reset();
    } else {
      message.textContent = "Please fill out all required fields.";
      message.style.color = "red";
    }
  });

  // Cancel button event listener
  cancelBtn.addEventListener("click", () => {
    form.reset();
    message.textContent = "Form cleared!";
    message.style.color = "#555";

    // Hide error messages
    usernameError.style.display = "none";
    emailError.style.display = "none";
    addressError.style.display = "none";
  });
});

  </script>
</body>
</html>
